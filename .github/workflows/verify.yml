name: Verify SDK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  windows:
    name: Windows (build and verify)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      # Windows PowerShell 5.1: the scripts must run on the PowerShell every Windows PC has.
      - name: Build
        shell: powershell
        run: ./tools/build.ps1
      - name: Verify
        shell: powershell
        run: ./tools/verify.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VentanaTools.Orbit.Extensions-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/*.tgz
          if-no-files-found: error
          retention-days: 14

  aot:
    name: Windows (Native AOT sample)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Build
        shell: powershell
        run: ./tools/build.ps1
      # Proves IsAotCompatible: the Countdown companion, published with Native AOT against the new packages.
      - name: Publish the Countdown sample with Native AOT
        shell: powershell
        run: |
          $state = Get-Content -Raw artifacts/build/state.json | ConvertFrom-Json
          $version = '-p:VentanaExtensionsVersion=' + $state.version
          dotnet publish samples/countdown-extension/CountdownExtensionSample.csproj -c Release -r win-x64 -p:PublishAot=true $version --packages $state.consumerPackages -o artifacts/aot/countdown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path artifacts/aot/countdown/CountdownExtensionSample.exe)) { throw 'No native executable was published.' }

  ubuntu:
    name: Ubuntu (portable tests and the Node SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Build
        run: dotnet build VentanaTools.Orbit.Extensions.slnx -c Release
      # The author package's portable tests and the Testing, tool and schema tests; the named-pipe,
      # sample and template tests carry the Windows trait.
      - name: Test
        run: dotnet test VentanaTools.Orbit.Extensions.slnx -c Release --no-build --filter "Platform!=Windows"
      - name: Node SDK
        run: |
          for package in node/*/; do
            (cd "$package" && npm ci --ignore-scripts --no-audit --no-fund && npm test)
          done
