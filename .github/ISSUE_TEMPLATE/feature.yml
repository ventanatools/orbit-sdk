name: Feature request
description: Propose something new for the SDK, the tool, the templates, the Node SDK or the contract.
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Author package (.NET)
        - Test kit
        - Tool
        - Templates
        - Node SDK
        - Samples
        - Contract, schemas or fixtures
        - Build, CI or repository
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to build, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
      description: What you would like to happen. For a change to the wire protocol or a file format, say how an older host or SDK should behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
