<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { height: 100%; padding: 12px; overflow-y: auto; }
    sp-heading, sp-body { margin-bottom: 8px; }
    sp-heading { font-size: 18px; }
    sp-body { display: block; }
    sp-button { display: block; width: 100%; margin-bottom: 8px; }
    #status { margin-bottom: 0; }
  </style>
</head>
<body>
  <sp-heading>Orbit Photoshop sample</sp-heading>
  <sp-body>Choose the private bridge file from the running companion.</sp-body>
  <sp-button id="connect">Choose bridge file</sp-button>
  <sp-button id="disconnect" variant="secondary">Disconnect</sp-button>
  <sp-body id="status" role="status" aria-live="polite">Disconnected.</sp-body>
  <script src="index.js"></script>
</body>
</html>
